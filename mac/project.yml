name: DeskPixie
options:
  bundleIdPrefix: com.sihekuang
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
configFiles:
  Debug: Configs/SharedSettings.xcconfig
  Release: Configs/SharedSettings.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_HARDENED_RUNTIME: YES
    # libdeskpixie.dylib (Go cgo) is built for the host arch only.
    ARCHS: arm64
    # Overridden by `make release VERSION=x.y.z` (MARKETING_VERSION, CURRENT_PROJECT_VERSION).
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  DeskPixieCore:
    path: Packages/DeskPixieCore
targets:
  DeskPixie:
    type: application
    platform: macOS
    sources:
      - path: DeskPixie
        excludes:
          - "Info.plist"
          - "DeskPixie.entitlements"
      # Folder reference: copied as Contents/Resources/pixies (first pack root).
      - path: ../pixies
        type: folder
        buildPhase: resources
      # Folder reference: Contents/Resources/design-system (canvas /ds/ pages, CANVAS.md,
      # examples); its path goes to dp_configure as `designSystem`.
      - path: ../design-system
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sihekuang.deskpixie
        PRODUCT_NAME: DeskPixie
        INFOPLIST_FILE: DeskPixie/Info.plist
        # DeskPixie/Assets.xcassets/AppIcon.appiconset, generated by scripts/make-app-icon.sh.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: DeskPixie/DeskPixie.entitlements
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        LIBRARY_SEARCH_PATHS: "$(SRCROOT)/../core/build"
        OTHER_LDFLAGS: "-ldeskpixie"
    dependencies:
      - package: DeskPixieCore
    preBuildScripts:
      - name: Build Go core
        # Always run: Go's build cache decides whether there is real work.
        basedOnDependencyAnalysis: false
        script: |
          set -e
          # Use the go already on PATH (CI: actions/setup-go; xcodebuild passes its environment
          # through). Xcode.app launched from the Dock does not inherit the login shell PATH, so
          # fall back to the login profile and the Homebrew prefixes, appended so they never
          # shadow a go that is already on PATH.
          if ! command -v go >/dev/null; then
            source ~/.zprofile 2>/dev/null || true
            export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin"
          fi
          command -v go >/dev/null || { echo "error: go not found (brew install go)" >&2; exit 1; }
          echo "Go core: $(command -v go) ($(go version))"
          cd "$SRCROOT/../core"
          unset GOFLAGS
          make build-dylib
          VERSION="$MARKETING_VERSION" make build-pix
        outputFiles:
          - "$(SRCROOT)/../core/build/libdeskpixie.dylib"
          - "$(SRCROOT)/../core/build/libdeskpixie.h"
          - "$(SRCROOT)/../core/build/pix"
    postCompileScripts:
      - name: Copy libdeskpixie.dylib into Frameworks
        script: |
          set -e
          DST="$BUILT_PRODUCTS_DIR/$FRAMEWORKS_FOLDER_PATH"
          mkdir -p "$DST"
          # install_name is already @rpath/libdeskpixie.dylib (core/Makefile).
          cp -pf "$SRCROOT/../core/build/libdeskpixie.dylib" "$DST/"
          # Sign with the app's identity so the hardened-runtime app can load it. With a real
          # identity (make release SIGNING_IDENTITY=...), notarization also needs a secure
          # timestamp and the hardened runtime on every Mach-O in the bundle.
          ID="${EXPANDED_CODE_SIGN_IDENTITY:--}"
          if [ "$ID" = "-" ]; then FLAGS=""; else FLAGS="--timestamp --options runtime"; fi
          codesign --force --sign "$ID" $FLAGS "$DST/libdeskpixie.dylib"
        inputFiles:
          - "$(SRCROOT)/../core/build/libdeskpixie.dylib"
        outputFiles:
          - "$(BUILT_PRODUCTS_DIR)/$(FRAMEWORKS_FOLDER_PATH)/libdeskpixie.dylib"
      - name: Copy pix into Helpers
        # pix, the terminal wrapper for sessions you start yourself (#89). Settings links
        # ~/.local/bin/pix here, so it updates with the app. Sessions run this very file:
        # writing or signing it in place makes macOS kill them (Code Signature Invalid, #190).
        # So pix.new is copied and signed, then renamed over pix: a new file, and running
        # sessions keep the old one until they restart.
        script: |
          set -e
          DST="$BUILT_PRODUCTS_DIR/$CONTENTS_FOLDER_PATH/Helpers"
          mkdir -p "$DST"
          rm -f "$DST/pix.new"
          cp -p "$SRCROOT/../core/build/pix" "$DST/pix.new"
          ID="${EXPANDED_CODE_SIGN_IDENTITY:--}"
          if [ "$ID" = "-" ]; then FLAGS=""; else FLAGS="--timestamp --options runtime"; fi
          codesign --force --sign "$ID" $FLAGS --identifier com.sihekuang.deskpixie.pix "$DST/pix.new"
          mv -f "$DST/pix.new" "$DST/pix"
        inputFiles:
          - "$(SRCROOT)/../core/build/pix"
        outputFiles:
          - "$(BUILT_PRODUCTS_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/pix"
      - name: Bundle libdf + DeepFilterNet3 model when built
        # core/Makefile build-dylib stages these when libdf is present (it is committed under
        # core/audio/denoise/libdf); otherwise the core is built without the deepfilter tag and the noise
        # filter passes audio through. libdf is dlopen'ed as @rpath/libdf.dylib (its
        # install name), which LD_RUNPATH_SEARCH_PATHS covers.
        basedOnDependencyAnalysis: false
        script: |
          set -e
          FW="$BUILT_PRODUCTS_DIR/$FRAMEWORKS_FOLDER_PATH"
          RES="$BUILT_PRODUCTS_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          LIBDF="$SRCROOT/../core/build/libdf.dylib"
          MODEL="$SRCROOT/../core/build/DeepFilterNet3.tar.gz"
          mkdir -p "$FW" "$RES"
          ID="${EXPANDED_CODE_SIGN_IDENTITY:--}"
          if [ "$ID" = "-" ]; then FLAGS=""; else FLAGS="--timestamp --options runtime"; fi
          STAMP="$DERIVED_FILE_DIR/libdf.signed-with"
          if [ -f "$LIBDF" ]; then
            # Copy + re-sign only when the source or the identity changed (signing a 16 MB
            # dylib every build is slow; a timestamped signature needs a network round-trip).
            if [ ! -f "$FW/libdf.dylib" ] || [ "$LIBDF" -nt "$FW/libdf.dylib" ] \
              || [ "$(cat "$STAMP" 2>/dev/null)" != "$ID" ]; then
              cp -pf "$LIBDF" "$FW/"
              codesign --force --sign "$ID" $FLAGS "$FW/libdf.dylib"
              mkdir -p "$DERIVED_FILE_DIR"
              echo "$ID" > "$STAMP"
            fi
          else
            rm -f "$FW/libdf.dylib" "$STAMP"
          fi
          if [ -f "$MODEL" ]; then
            cp -pf "$MODEL" "$RES/"
          else
            rm -f "$RES/DeepFilterNet3.tar.gz"
          fi
schemes:
  DeskPixie:
    build:
      targets:
        DeskPixie: all
    run:
      config: Debug
