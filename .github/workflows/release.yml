name: Release

# Triggered by:
#   - Tag pushes matching vX.Y.Z (e.g. v0.4.0) : full release (sign + notarize + staple + GitHub Release)
#   - Manual dispatch from main                : Developer ID signed build only (smoke test, not notarized)
#
# Mirrors ai-mascot's release.yml (same secret names, `release` environment). Apple's flow:
# sign every Mach-O with Developer ID + hardened runtime + timestamp (make -C mac release),
# notarize the zipped .app and staple it, build the .dmg from the stapled .app, sign the dmg,
# notarize and staple it, then check both with spctl.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

jobs:
  build:
    name: Build, sign, notarize, release
    # Dispatch builds sign with the real cert, so only allow them from main or a release tag.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    environment: release
    # macos-15 runners are arm64, hence arm64 in the artifact names.
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Resolve release tag and version
        id: tag
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Tag '$TAG' must match vMAJOR.MINOR.PATCH (e.g. v0.4.0)"
              exit 1
            fi
            VERSION="${TAG#v}"
            IS_RELEASE=true
          else
            TAG="dispatch-${GITHUB_RUN_NUMBER}"
            VERSION="0.0.0"
            IS_RELEASE=false
          fi
          {
            echo "name=$TAG"
            echo "version=$VERSION"
            echo "is_release=$IS_RELEASE"
            echo "ref_slug=${GITHUB_REF_NAME//\//-}"
          } >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG  Version: $VERSION  Is release: $IS_RELEASE"

      # Same choice as ci.yml: the newest stable Xcode on the image.
      - name: Select Xcode
        run: |
          set -euo pipefail
          XCODE=$(printf '%s\n' /Applications/Xcode_*.app | grep -viE 'beta|release_candidate|_rc' | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - uses: actions/setup-go@v6
        with:
          go-version-file: core/go.mod
          cache: true
          cache-dependency-path: core/go.sum

      - name: Install xcodegen
        run: brew install xcodegen

      # Offline tests only (fakes; live tests are behind -tags live). No macOS permissions needed.
      - name: Run tests
        run: |
          set -euo pipefail
          (cd core && go vet ./... && go test -race ./... && go test -race -tags deepfilter ./audio/denoise/)
          (cd mac/Packages/DeskPixieCore && swift test)

      # Import the Developer ID Application cert into a temp keychain.
      # The keychain is wiped in the always-run cleanup step at the end
      # of the job, so the cert never persists past this run.
      - name: Set up signing keychain
        env:
          P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KC_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/build.keychain-db"
          P12="$RUNNER_TEMP/cert.p12"

          echo "$P12_BASE64" | base64 --decode > "$P12"
          [ -s "$P12" ] || { echo "::error::decoded p12 is empty; re-push MACOS_CERT_P12_BASE64"; exit 1; }

          security create-keychain -p "$KC_PASSWORD" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASSWORD" "$KC"

          # macOS 15's `security import` needs -f pkcs12; -A lets codesign use the key.
          security import "$P12" \
            -k "$KC" \
            -P "$P12_PASSWORD" \
            -f pkcs12 \
            -A \
            -T /usr/bin/codesign

          # Prepend the temp keychain to the search list so codesign finds the identity
          # (word splitting intended: one argument per existing keychain).
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KC" \
            $(security list-keychains -d user | tr -d '"' | xargs)

          # Without this, codesign waits on an "always allow" dialog on the headless runner.
          security set-key-partition-list \
            -S apple-tool:,apple: -s -k "$KC_PASSWORD" "$KC" >/dev/null

          rm -f "$P12"

      # Tag builds only: the App Store Connect API key used for notarization.
      # Removed in the cleanup step.
      - name: Decode notarization API key
        if: steps.tag.outputs.is_release == 'true'
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          P8="$RUNNER_TEMP/AuthKey.p8"
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$P8"
          [ -s "$P8" ] || { echo "::error::decoded p8 is empty; re-push APPLE_API_KEY_BASE64"; exit 1; }
          chmod 600 "$P8"

      # Signs the app and re-signs the bundled libdeskpixie/libdf with the Developer ID identity,
      # hardened runtime and a secure timestamp; verify-release runs at the end.
      - name: Build and sign
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          [ -n "$SIGNING_IDENTITY" ] || { echo "::error::MACOS_SIGNING_IDENTITY is not set"; exit 1; }
          make -C mac release VERSION="$VERSION" BUILD_NUMBER="$GITHUB_RUN_NUMBER"

      - name: Verify, notarize and package
        id: pack
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          IS_RELEASE: ${{ steps.tag.outputs.is_release }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          set -euo pipefail
          APP="mac/build/Build/Products/Release/DeskPixie.app"
          test -d "$APP" || { echo "::error::$APP not found"; exit 1; }

          mkdir -p out
          DMG="out/DeskPixie-$VERSION-arm64.dmg"
          ZIP="out/DeskPixie-$VERSION-arm64.app.zip"

          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dvv "$APP" 2>&1 | head -20
          ENT=$(codesign -d --entitlements - "$APP" 2>&1)
          grep -q 'device.audio-input' <<<"$ENT" \
            || { echo "::error::audio-input entitlement missing from signed app"; exit 1; }
          # Every Mach-O must carry Developer ID + hardened runtime + timestamp for notarization.
          for f in "$APP" "$APP"/Contents/Frameworks/*.dylib; do
            INFO=$(codesign -dvv "$f" 2>&1)
            grep -q '^Authority=Developer ID Application' <<<"$INFO" \
              || { echo "::error::$f is not signed with Developer ID"; exit 1; }
            grep -q 'flags=.*runtime' <<<"$INFO" \
              || { echo "::error::$f lacks the hardened runtime"; exit 1; }
            grep -q '^Timestamp=' <<<"$INFO" \
              || { echo "::error::$f lacks a secure timestamp"; exit 1; }
          done

          # Submit, wait, and fail with Apple's log unless the submission is Accepted.
          notarize() {
            local file="$1" out id status
            out=$(xcrun notarytool submit "$file" \
              --key "$RUNNER_TEMP/AuthKey.p8" \
              --key-id "$NOTARY_KEY_ID" \
              --issuer "$NOTARY_ISSUER_ID" \
              --wait --timeout 30m --output-format json) || true
            echo "$out"
            id=$(plutil -extract id raw -o - - <<<"$out" 2>/dev/null || true)
            status=$(plutil -extract status raw -o - - <<<"$out" 2>/dev/null || true)
            if [ "$status" != "Accepted" ]; then
              if [ -n "$id" ]; then
                xcrun notarytool log "$id" \
                  --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" || true
              fi
              echo "::error::notarization of $file: ${status:-no result}"
              exit 1
            fi
          }

          if [ "$IS_RELEASE" = "true" ]; then
            # 1. Notarize the app (as a zip) and staple the ticket to the .app itself.
            ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize-app.zip"
            notarize "$RUNNER_TEMP/notarize-app.zip"
            rm -f "$RUNNER_TEMP/notarize-app.zip"
            xcrun stapler staple "$APP"
            xcrun stapler validate "$APP"
          fi

          # 2. The dmg: the (stapled) app plus an /Applications symlink to drag it onto.
          STAGE="$RUNNER_TEMP/dmg"
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          ditto "$APP" "$STAGE/DeskPixie.app"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "DeskPixie" -srcfolder "$STAGE" -ov -format UDZO "$DMG"
          rm -rf "$STAGE"
          codesign --force --sign "$SIGNING_IDENTITY" --timestamp "$DMG"
          codesign --verify --verbose=2 "$DMG"

          if [ "$IS_RELEASE" = "true" ]; then
            # 3. Notarize and staple the dmg, then check both with Gatekeeper.
            notarize "$DMG"
            xcrun stapler staple "$DMG"
            xcrun stapler validate "$DMG"
            spctl --assess --type open --context context:primary-signature -v "$DMG"
            spctl --assess --type execute -v "$APP"
          fi

          ditto -c -k --keepParent --sequesterRsrc "$APP" "$ZIP"
          ls -lh out
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: DeskPixie-${{ steps.tag.outputs.ref_slug }}
          path: |
            ${{ steps.pack.outputs.dmg }}
            ${{ steps.pack.outputs.zip }}
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: steps.tag.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: |
            ${{ steps.pack.outputs.dmg }}
            ${{ steps.pack.outputs.zip }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            **DeskPixie**: Developer ID signed and notarized (Apple silicon).

            ### Install
            1. Download the `.dmg`, open it and drag DeskPixie to `/Applications`.
            2. Launch it (it lives in the menu bar) and allow microphone access when prompted
               (needed for voice).

            The `.app.zip` is the same app, zipped.

      # always() so a failed build leaves neither the cert nor the API key behind.
      - name: Cleanup signing keychain and API key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/notarize-app.zip"
